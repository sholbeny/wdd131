<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A LEGO product review form where users can rate sets, choose useful features, and submit a review.">
    <meta name="author" content="Samantha Holbeny">
    <title>LEGO Set Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/products.js" defer></script>
</head>
<body>
    <header>
        <h1>LEGO Set Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <label for="product">LEGO Set Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

         <fieldset>
            <legend>Overall Rating</legend>
            
            <input type="radio" id="rating1" name="rating" value="1" required>
            <label for="rating1">☆</label>

            <input type="radio" id="rating2" name="rating" value="2" required>
            <label for="rating2">☆☆</label>

            <input type="radio" id="rating3" name="rating" value="3" required>
            <label for="rating3">☆☆☆</label>

            <input type="radio" id="rating4" name="rating" value="4" required>
            <label for="rating4">☆☆☆☆</label>

            <input type="radio" id="rating5" name="rating" value="5" required>
            <label for="rating5">☆☆☆☆☆</label>
        </fieldset>

         <label for="dateBuilt">Date Built</label>
         <input type="date" id="dateBuilt" name="dateBuilt" required>
        
        <fieldset>
            
            <legend>Useful Features</legend>
            
            <input type="checkbox" id="minifigures" name="features" value="Minifigures">
            <label for="minifigures">Minifigures</label>

            <input type="checkbox" id="display" name="features" value="Display Value">
            <label for="display">Display Value</label>

            <input type="checkbox" id="building" name="features" value="Building Experience">
            <label for="building">Building Experience</label>

            <input type="checkbox" id="pieces" name="features" value="Piece Variety">
            <label for="pieces">Piece Variety</label>

            <input type="checkbox" id="play" name="features" value="Play Features">
            <label for="play">Play Features</label>
        
        </fieldset>

            <label for="review">Written Review</label>
            <textarea id="review" name="review" rows="5"></textarea>

            <label for="username">Your Name</label>
            <input type="text" id="username" name="username">

            <input type="submit" value="Submit LEGO Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Samantha Holbeny | Minnesota</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
